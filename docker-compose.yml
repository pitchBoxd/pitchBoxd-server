services:
  db:
    image: mysql:8.0
    container_name: local-pitch-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_DATABASE: db
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pitchboxd-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    name: pitchboxd-network
