spring:
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false

  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

s3:
  bucket-name: test-bucket
  bucket-path: test/images