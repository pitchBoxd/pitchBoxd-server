security:
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_URL}
    signup-redirect-url: ${OAUTH2_SIGNUP_URL}
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID}
          client-secret: ${GOOGLE_CLIENT_SECRET}
          scope: profile, email

jwt:
  secret:
    access_key: ${JWT_ACCESS_SECRET_KEY}
    refresh_key: ${JWT_REFRESH_SECRET_KEY}
    signup_key: ${JWT_SIGNUP_SECRET_KEY}

expiration:
  access-token-time: ${ACCESS_TOKEN_EXPIRATION_TIME}
  refresh-token-time: ${REFRESH_TOKEN_EXPIRATION_TIME}
  signup-token-time: ${SIGNUP_TOKEN_EXPIRATION_TIME}

app:
  policy:
    match-review-limit: 48h