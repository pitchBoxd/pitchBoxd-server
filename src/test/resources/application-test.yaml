spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false

  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false
  security:
    oauth2:
      success-redirect-url: tttt
      signup-redirect-url: tttt
      client:
        registration:
          google:
            client-id: 1234
            client-secret: 1234
            redirect-uri: 1234
            scope: profile, email, openid

s3:
  bucket-name: test-bucket
  bucket-path: test/images

jwt:
  secret:
    access_key: "test-access-secret-key-at-least-32-characters"
    refresh_key: "test-refresh-secret-key-at-least-32-characters"
    signup_key: "test-signup-secret-key-at-least-32-characters"

expiration:
  access-token-time: 3600000
  refresh-token-time: 86400000
  signup-token-time: 900000

app:
  policy:
    match-review-limit: 48h
    player_review-limit: 48h